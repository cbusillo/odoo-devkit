---
name: CI

"on":
  push:
    branches:
      - main
      - "launchplane/train/**"
  pull_request:

permissions:
  contents: read

jobs:
  runtime-python-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify runtime Python lock
        run: uv lock --check --offline --no-config --project docker/runtime-python

  test:
    runs-on: ubuntu-latest
    # Pull-request budget: the lane runs in about 30 seconds; a run past
    # 5 minutes fails here instead of queueing silently.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests
