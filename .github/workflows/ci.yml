---
name: CI

"on":
  push:
    branches:
      - main
      - "launchplane/train/**"
  pull_request:

permissions:
  contents: read

jobs:
  runtime-python-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify runtime Python lock
        run: uv lock --check --offline --no-config --project docker/runtime-python

  test:
    runs-on: ubuntu-latest
    # Pull-request budget: the lane runs in about 30 seconds; a run past
    # 5 minutes fails here instead of queueing silently.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Check out style check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cbusillo/codex-skills
          ref: 5923e84d2a3358dfcea8ca5abc610b35770794c4
          path: .style-check-catalog
          persist-credentials: false

      - name: Check new comments and docstrings
        run: >-
          uv run --no-project --no-config .style-check-catalog/scripts/check_new_comments.py
          --repo . --base HEAD^1 --format github
