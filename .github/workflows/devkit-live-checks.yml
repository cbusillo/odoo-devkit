name: Devkit live Odoo checks

"on":
  pull_request:
    paths:
      - 'docker/**'
      - 'odoo_devkit/addon_ci.py'
      - 'tests/live_odoo/**'
      - '.github/workflows/devkit-live-checks.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [main, 'launchplane/train/**']
    paths:
      - 'docker/**'
      - 'odoo_devkit/addon_ci.py'
      - 'tests/live_odoo/**'
      - '.github/workflows/devkit-live-checks.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  devkit-live-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: '19.0'
            image: ghcr.io/cbusillo/odoo-docker:19.0-devtools
            shared_ref: 5dcf55162eca8cbcc026789e6cb4f0c79f7c8733
          - series: '20.0'
            image: ghcr.io/cbusillo/odoo-docker@sha256:4c36271cc8ad71c865d00b772131d020e5c1a3109666fb6bf464f62df531fd8e
            shared_ref: 158bec70b8c216a47d6f86510dcad8c769db6d19
    steps:
      - uses: actions/checkout@v7
      - name: Checkout the real settings addon and its test loader
        uses: actions/checkout@v7
        with:
          repository: cbusillo/odoo-shared-addons
          ref: ${{ matrix.shared_ref }}
          path: .ci-support
          sparse-checkout: |
            launchplane_settings
            test_support
      - uses: astral-sh/setup-uv@v7
      - name: Record settings source
        run: |
          mkdir -p ci-evidence
          git -C .ci-support rev-parse HEAD > ci-evidence/shared-addons-commit.txt
      - name: Run live checks and planted faults on throwaway databases
        run: >-
          uv run --locked python -m odoo_devkit.addon_ci
          --image ${{ matrix.image }}
          --odoo-version ${{ matrix.series }}
          --addons-root tests/live_odoo/addons
          --support-root .ci-support
          --devkit-checks
          --output ci-evidence
          --timeout 750
      - name: Preserve live-check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devkit-live-checks-${{ matrix.series }}
          path: ci-evidence
          if-no-files-found: error
