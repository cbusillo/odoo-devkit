name: Odoo addon tests
description: Run owned addon suites against a disposable database with Chromium
inputs:
  addons-root:
    description: Checked-out repository's addon directory, relative to the workspace
    required: true
  tenant:
    description: Tenant checkout containing workspace.toml and uv.lock, relative to the workspace
    default: ''
  support-root:
    description: Shared addons checkout relative to the workspace, if separate from the owned addons
    default: ''
  image:
    description: Devtools image; omitted for tenants to use workspace.toml
    default: ''
  output:
    description: Directory for Odoo logs, result and elapsed time
    required: true
  source-token:
    description: Existing repository source-read token for manifest-declared private addons
    default: ''
  command-metadata:
    description: Repository github.json for validation commands, relative to the workspace
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Check shared Python style
      if: ${{ inputs.command-metadata != '' }}
      shell: bash
      env:
        STYLE_CHECK_METADATA: ${{ inputs.command-metadata }}
        ODOO_DEVKIT_REPO: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        metadata="$GITHUB_WORKSPACE/$STYLE_CHECK_METADATA"
        lint_command=$(jq -er '
          .qualityGate.lint.ruff |
          if . == null then "" elif type == "string" and test("\\S") then .
          else error("qualityGate.lint.ruff must be a nonempty string") end
        ' "$metadata")
        if [ -n "$lint_command" ]; then
          format_command=$(jq -er '.qualityGate.format.default | strings | select(test("\\S"))' "$metadata") || {
            echo '::error::qualityGate.format.default must accompany qualityGate.lint.ruff'
            exit 1
          }
          source_root=$(git -C "$(dirname "$metadata")" rev-parse --show-toplevel)
          cd "$source_root"
          quality_exit=0
          bash -euo pipefail -c "$lint_command" || quality_exit=$?
          bash -euo pipefail -c "$format_command" || quality_exit=$?
          git diff --exit-code HEAD || quality_exit=$?
          exit "$quality_exit"
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: cbusillo/codex-skills
        ref: 07399a67a1e5b7e330bcc6445e516b94630bdbf3
        path: .style-check-catalog
        persist-credentials: false
    - name: Check new comments
      shell: bash
      env:
        STYLE_CHECK_ROOT: ${{ inputs.addons-root }}
        STYLE_CHECK_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        source_root=$(git -C "$GITHUB_WORKSPACE/$STYLE_CHECK_ROOT" rev-parse --show-toplevel)
        if ! git -C "$source_root" rev-parse --verify --quiet 'HEAD^1' >/dev/null; then
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$STYLE_CHECK_TOKEN" | base64 -w0)" \
            git -C "$source_root" fetch --quiet --no-tags --depth=2 origin "$(git -C "$source_root" rev-parse HEAD)"
        fi
        uv run --no-project --no-config "$GITHUB_WORKSPACE/.style-check-catalog/scripts/check_new_comments.py" \
          --repo "$source_root" --base 'HEAD^1' --format github
    - name: Run addon tests
      shell: bash
      env:
        ADDON_CI_ACTION: ${{ github.action_path }}
        ADDON_CI_ROOT: ${{ inputs.addons-root }}
        ADDON_CI_TENANT: ${{ inputs.tenant }}
        ADDON_CI_SUPPORT: ${{ inputs.support-root }}
        ADDON_CI_IMAGE: ${{ inputs.image }}
        ADDON_CI_OUTPUT: ${{ inputs.output }}
        ADDON_CI_SOURCE_TOKEN: ${{ inputs.source-token }}
        ADDON_CI_METADATA: ${{ inputs.command-metadata }}
      run: |
        set -euo pipefail
        if [ -n "$ADDON_CI_METADATA" ]; then
          uv --directory "$ADDON_CI_ACTION/../../.." run --locked python -m odoo_devkit.addon_test_command "$GITHUB_WORKSPACE/$ADDON_CI_METADATA"
        fi
        if [[ "$ADDON_CI_OUTPUT" != /* ]]; then ADDON_CI_OUTPUT="$GITHUB_WORKSPACE/$ADDON_CI_OUTPUT"; fi
        args=(--addons-root "$GITHUB_WORKSPACE/$ADDON_CI_ROOT" --output "$ADDON_CI_OUTPUT")
        if [ -n "$ADDON_CI_TENANT" ]; then args+=(--tenant "$GITHUB_WORKSPACE/$ADDON_CI_TENANT"); fi
        if [ -n "$ADDON_CI_SUPPORT" ]; then args+=(--support-root "$GITHUB_WORKSPACE/$ADDON_CI_SUPPORT"); fi
        if [ -n "$ADDON_CI_IMAGE" ]; then args+=(--image "$ADDON_CI_IMAGE"); fi
        uv --directory "$ADDON_CI_ACTION/../../.." run --locked python -m odoo_devkit.addon_ci "${args[@]}"
