name: Odoo addon tests
description: Run owned addon suites against a disposable database with Chromium
inputs:
  addons-root:
    description: Checked-out repository's addon directory, relative to the workspace
    required: true
  tenant:
    description: Tenant checkout containing workspace.toml and uv.lock, relative to the workspace
    default: ''
  support-root:
    description: Shared addons checkout relative to the workspace, if separate from the owned addons
    default: ''
  image:
    description: Devtools image; omitted for tenants to use workspace.toml
    default: ''
  output:
    description: Directory for Odoo logs, result and elapsed time
    required: true
  source-token:
    description: Existing repository source-read token for manifest-declared private addons
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
    - name: Run addon tests
      shell: bash
      env:
        ADDON_CI_ACTION: ${{ github.action_path }}
        ADDON_CI_ROOT: ${{ inputs.addons-root }}
        ADDON_CI_TENANT: ${{ inputs.tenant }}
        ADDON_CI_SUPPORT: ${{ inputs.support-root }}
        ADDON_CI_IMAGE: ${{ inputs.image }}
        ADDON_CI_OUTPUT: ${{ inputs.output }}
        ADDON_CI_SOURCE_TOKEN: ${{ inputs.source-token }}
      run: |
        set -euo pipefail
        if [[ "$ADDON_CI_OUTPUT" != /* ]]; then ADDON_CI_OUTPUT="$GITHUB_WORKSPACE/$ADDON_CI_OUTPUT"; fi
        args=(--addons-root "$GITHUB_WORKSPACE/$ADDON_CI_ROOT" --output "$ADDON_CI_OUTPUT")
        if [ -n "$ADDON_CI_TENANT" ]; then args+=(--tenant "$GITHUB_WORKSPACE/$ADDON_CI_TENANT"); fi
        if [ -n "$ADDON_CI_SUPPORT" ]; then args+=(--support-root "$GITHUB_WORKSPACE/$ADDON_CI_SUPPORT"); fi
        if [ -n "$ADDON_CI_IMAGE" ]; then args+=(--image "$ADDON_CI_IMAGE"); fi
        uv --directory "$ADDON_CI_ACTION/../../.." run --locked python -m odoo_devkit.addon_ci "${args[@]}"
